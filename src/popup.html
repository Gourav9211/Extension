<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Analyst</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">&#9822;</div>
        <div>
          <div class="brand-name">Chess Analyst</div>
        </div>
      </div>
      <div class="spacer" style="flex:1"></div>
      <button id="dark-toggle" class="icon-btn" type="button" title="Toggle theme" aria-label="Toggle theme">&#9789;</button>
      <button id="toggle-analysis" class="icon-btn" type="button" title="Pause analysis (Ctrl+Shift+A)" aria-label="Pause analysis" aria-pressed="false">&#9210;</button>
    </header>

    <div class="body">
      <div id="status-bar" class="pill" role="status" aria-live="polite">
        <span class="pill-dot"></span>
        <span class="pill-text" id="status-text">Waiting for game&hellip;</span>
      </div>

      <div id="update-banner" class="banner banner-update" hidden>
        <span id="update-text"></span>
        <a id="update-link" href="#" target="_blank" rel="noopener noreferrer">Release</a>
      </div>

      <div id="opening-banner" class="banner banner-opening" hidden>
        <span aria-hidden="true">&#9816;</span>
        <span id="opening-name"></span>
      </div>

      <div id="classification-banner" class="banner banner-cls" hidden>
        <span id="classify-icon" class="sym"></span>
        <span id="classify-text"></span>
      </div>

      <div id="skeleton" class="card" hidden>
        <div class="skel">
          <div class="skel-line w40"></div>
          <div class="skel-line w90"></div>
          <div class="skel-line w70"></div>
        </div>
      </div>

      <div id="eval-container" class="card" hidden>
        <div class="card-head">
          <span class="card-title">Evaluation</span>
        </div>
        <div class="meter-wrap">
          <div class="meter">
            <div class="meter-fill" id="eval-fill"></div>
            <div class="meter-cap" style="left:50%"></div>
          </div>
        </div>
        <div class="meter-legend"><span>Black</span><span>White</span></div>
      </div>

      <section id="result" class="card" hidden>
        <div class="card-head">
          <span class="card-title">Best move</span>
        </div>
        <div class="primary-move">
          <span class="best-move" id="move">--</span>
          <span class="eval-chip">
            <span class="eval-num white" id="eval-num">0.0</span>
            <span class="eval-side" id="eval-side">white</span>
          </span>
        </div>
        <div class="depth-line">
          <span class="depth-badge" id="depth-badge">d22</span>
          <span id="engine"></span>
        </div>
        <div class="alt-list" id="alt-moves"></div>
      </section>

      <section class="card maia" id="maia-section" hidden>
        <div class="card-head">
          <span class="card-title">Maia</span>
        </div>
        <div class="maia-top">
          <span class="maia-rating" id="maia-elo">1500</span>
          <span class="maia-wdl" id="maia-eval"></span>
        </div>
        <div class="maia-bars" id="maia-moves"></div>
        <p class="maia-note" id="maia-note"></p>
      </section>

      <section class="card explain" id="explanation-section" hidden>
        <div class="card-head"><span class="card-title">Why</span></div>
        <p id="explanation"></p>
      </section>

      <div id="graph-section" class="card graph-card" hidden>
        <canvas id="eval-graph" width="360" height="54"></canvas>
      </div>

      <div id="history-section" class="card" hidden>
        <div class="card-head">
          <span class="card-title">History</span>
          <span class="spacer"></span>
          <span id="accuracy-badge" class="acc-badge" hidden></span>
        </div>
        <div class="hist" id="move-history"></div>
      </div>

      <div id="no-game" class="card empty">
        <div class="empty-art" aria-hidden="true">&#9822;</div>
        <p>Open a game on Chess.com to start analysing.</p>
      </div>
    </div>

    <div class="foot-meta">
      <span id="version-text"></span>
      <span class="spacer"></span>
      <span id="update-status-text"></span>
      <button id="check-update" class="link" type="button">Check</button>
    </div>

    <footer class="foot">
      <button id="save-game" class="btn" type="button">Save</button>
      <button id="export-pgn" class="btn" type="button">PGN</button>
      <button id="settings" class="btn btn-ghost" type="button">Settings</button>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
