<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Position Analyst</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">POST-GAME TOOL</p>
      <h1>Position analyst</h1>
      <p class="muted">Capture the visible Chess.com board and inspect a strong continuation.</p>
    </header>
    <button id="analyze" type="button">Analyze position</button>
    <button id="settings" class="secondary" type="button">Set Gemini API key</button>
    <p id="status" class="status" role="status">Ready.</p>
    <section id="result" hidden>
      <div class="move-row"><span>Recommended move</span><strong id="move">--</strong></div>
      <p id="engine"></p>
      <div class="explanation"><h2>Why it works</h2><p id="explanation"></p></div>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
